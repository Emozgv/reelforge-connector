<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ReelForge Connector</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b0b0c;
    color: #e7e5e2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  .card { width: 100%; max-width: 340px; padding: 0 24px; text-align: center; }
  .logo { font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #D39448; margin-bottom: 14px; }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 8px; }
  p { font-size: 12.5px; line-height: 1.5; color: #9a9894; margin: 0; }
  .spinner {
    width: 22px; height: 22px; margin: 18px auto 14px;
    border: 2.5px solid rgba(211,148,72,0.25);
    border-top-color: #D39448;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .spinner.hidden { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .check { font-size: 30px; margin: 14px 0; color: #34d399; }
  .err { font-size: 30px; margin: 14px 0; color: #f87171; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">ReelForge Connector</div>
    <div id="icon" class="spinner hidden"></div>
    <h1 id="title">Waiting for a connection request…</h1>
    <p id="subtitle">Open Research Accounts in ReelForge and press Connect Account — this window picks it up automatically.</p>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
