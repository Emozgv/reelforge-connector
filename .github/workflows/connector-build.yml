name: Build ReelForge Connector

# Builds the ReelForge Connector desktop helper (connector-app/) for both
# macOS and Windows in the same run. This repo has no Windows machine to
# build/test on directly, so Windows builds only exist via this CI matrix —
# same pattern ReelForge Internal already uses for its own releases.
#
# This does not sign or auto-publish anything yet (no code-signing
# certificate or updater key configured for this app). It just produces
# real, installable artifacts — both as workflow run artifacts and as
# assets on a rolling "connector-latest" GitHub Release, so there's always
# one stable, permanent link to the newest build of each platform's
# installer rather than having to dig through individual run pages.

on:
  push:
    branches: [main]
    paths:
      - "connector-app/**"
      - ".github/workflows/connector-build.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin
            asset_name: ReelForge-Connector-macOS.dmg
            built_glob: src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            target: windows
            asset_name: ReelForge-Connector-Windows-Setup.exe
            built_glob: src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: connector-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: connector-app/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build ReelForge Connector (${{ matrix.target }})
        run: npm run build

      # The real Tauri-produced filename carries the version number
      # (e.g. "ReelForge Connector_0.1.0_x64-setup.exe") — renaming to a
      # fixed name here is what lets both the workflow artifact and the
      # release asset (and, downstream, the Supabase-hosted copy the web
      # app links to) stay at one unchanging filename across version bumps.
      - name: Rename to fixed asset name (bash)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist-release
          cp ${{ matrix.built_glob }} "dist-release/${{ matrix.asset_name }}"

      - name: Rename to fixed asset name (pwsh)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          $src = Get-ChildItem -Path "${{ matrix.built_glob }}"
          Copy-Item $src.FullName "dist-release/${{ matrix.asset_name }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: connector-app/dist-release/${{ matrix.asset_name }}

  publish-release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download all built installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish rolling connector-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: connector-latest
          name: ReelForge Connector (latest)
          body: Always the most recent build from main. Not versioned — download the installer for your OS below.
          make_latest: true
          files: release-assets/*
