name: Build ReelForge Connector

# Builds the ReelForge Connector desktop helper (connector-app/) for both
# macOS and Windows in the same run. This repo has no Windows machine to
# build/test on directly, so Windows builds only exist via this CI matrix —
# same pattern ReelForge Internal already uses for its own releases.
#
# This does not sign or auto-publish anything yet (no code-signing
# certificate or updater key configured for this app). It just produces real,
# installable artifacts you can download from the run and test.

on:
  push:
    branches: [main]
    paths:
      - "connector-app/**"
      - ".github/workflows/connector-build.yml"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: connector-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: connector-app/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build ReelForge Connector (${{ matrix.target }})
        run: npm run build

      - name: Upload macOS artifact
        if: matrix.target == 'darwin'
        uses: actions/upload-artifact@v4
        with:
          name: ReelForge-Connector-macOS
          path: connector-app/src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload Windows artifact
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ReelForge-Connector-Windows
          path: connector-app/src-tauri/target/release/bundle/nsis/*.exe
