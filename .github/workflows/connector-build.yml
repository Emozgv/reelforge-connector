name: Build ReelForge Connector

# Builds the ReelForge Connector desktop helper (connector-app/) for both
# macOS and Windows in the same run. This repo has no Windows machine to
# build/test on directly, so Windows builds only exist via this CI matrix —
# same pattern ReelForge Internal already uses for its own releases.
#
# Every build here also gets an updater signature (Tauri's built-in
# updater — see TAURI_SIGNING_PRIVATE_KEY below) and a version bumped to
# 0.1.<run number>, so already-installed Connectors can discover and
# install it automatically on their next launch — see spawn_update_check()
# in src-tauri/src/lib.rs. The installers, the updater artifacts (.tar.gz
# on macOS, the NSIS .exe itself on Windows) and their .sig files, plus the
# merged latest.json manifest the updater actually polls, all land on the
# same rolling "connector-latest" GitHub Release so there's always one
# stable, permanent link to the newest build of each platform.

on:
  push:
    branches: [main]
    paths:
      - "connector-app/**"
      - ".github/workflows/connector-build.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin
          - os: windows-latest
            target: windows
            updater_platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: connector-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # The macOS build produces one universal (arm64 + x86_64) binary so
      # there's a single Mac download that works on every customer's
      # machine — Apple Silicon or Intel — instead of splitting the release
      # (and the download button, and the updater manifest) across two
      # separate Mac artifacts that could drift out of sync with each
      # other the way the old Supabase download link drifted from CI.
      - name: Add macOS universal build targets
        if: matrix.target == 'darwin'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: connector-app/src-tauri

      - name: Install dependencies
        run: npm ci

      # A rolling "connector-latest" release has no natural version of its
      # own to bump by hand — the workflow run number is a free, always-
      # increasing counter that's identical across both matrix legs of the
      # same run, which is exactly what's needed so the updater sees one
      # consistent version number for a given release regardless of which
      # platform's Connector is asking.
      #
      # The committed tauri.conf.json carries a dev-safe identity (identifier
      # net.reelforge.connector.dev, scheme reelforge-connect-dev) so that
      # any local `tauri dev`/`tauri build` can never register itself as, or
      # hijack the deep-link scheme of, the real production Connector. Only
      # this CI step restores the production identity/name/scheme, and only
      # right before the official release build compiles.
      - name: Set release version and production identity
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            c.version = '0.1.${{ github.run_number }}';
            c.productName = 'ReelForge Connector';
            c.identifier = 'net.reelforge.connector';
            c.plugins['deep-link'].desktop.schemes = ['reelforge-connect'];
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
          "

      - name: Prepare bundled runtime (darwin)
        if: matrix.target == 'darwin'
        run: npm run prepare:runtime

      # APPLE_CERTIFICATE/APPLE_CERTIFICATE_PASSWORD/APPLE_SIGNING_IDENTITY
      # are picked up directly by Tauri's bundler on macOS: it imports the
      # certificate into a temporary keychain itself and signs the .app.
      # APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID are also needed here even
      # though this build's own notarization attempt is discarded (see
      # --skip-stapling below): Tauri's comprehensive per-file codesign pass
      # — which walks and signs every nested Mach-O in the bundled
      # Playwright Chromium runtime, not just the outer .app — only runs
      # when notarization credentials are present at all; without them
      # Tauri signs just the outer .app and main executable, leaving every
      # nested file completely unsigned. --skip-stapling makes Tauri submit
      # for notarization but NOT wait for or fail on the result, since its
      # codesign pass still leaves the bundled Chromium's own .framework
      # invalidly signed (a known Tauri bundler limitation:
      # https://github.com/tauri-apps/tauri/issues/7690) — the next step
      # fixes just that framework and performs the real notarization+staple
      # itself, after this comprehensive signing pass has already run.
      # No-op on the Windows leg.
      - name: Build ReelForge Connector (${{ matrix.target }})
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "darwin" ]; then
            npx tauri build --target universal-apple-darwin --skip-stapling
          else
            npm run build
          fi

      # Tauri has already signed the .app above, but (per the known bundler
      # limitation linked in the previous step) the bundled Chromium
      # Framework specifically ends up with an invalid, non-bundle-aware
      # signature. Fixed here by re-signing just that framework properly —
      # as its bundle directory, so codesign resolves its Versions/Current
      # symlink and embeds a real framework-bundle signature — then
      # re-signing the outer .app so its CodeResources manifest picks up
      # the framework's corrected hash. Only then is this submitted to
      # Apple for notarization and stapled; the DMG and updater .tar.gz
      # Tauri built above are stale at this point (built from the
      # not-yet-fixed, not-yet-notarized app), so both are rebuilt from
      # this final stapled .app afterward — a customer must never receive
      # an artifact containing the pre-fix app.
      - name: Fix framework signature, notarize and staple (darwin)
        if: matrix.target == 'darwin'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -e
          BUNDLE_DIR="src-tauri/target/universal-apple-darwin/release/bundle"
          APP_PATH="$BUNDLE_DIR/macos/ReelForge Connector.app"

          KEYCHAIN_PATH="$RUNNER_TEMP/apple-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/apple-cert.p12"
          echo "$APPLE_CERTIFICATE" | base64 -D > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$CERT_PATH"

          # Path resolved by search rather than hardcoding the bundled
          # Chromium build number, so a future Playwright version bump
          # can't silently make this a no-op.
          FRAMEWORK=$(find "$APP_PATH/Contents/Resources/node_modules/playwright-core/.local-browsers" -name "Chromium Framework.framework" -maxdepth 8)
          if [ -z "$FRAMEWORK" ]; then
            echo "Could not locate Chromium Framework.framework inside the bundled app — aborting rather than shipping a mis-signed build."
            exit 1
          fi
          codesign --force --options runtime --timestamp --keychain "$KEYCHAIN_PATH" --sign "$APPLE_SIGNING_IDENTITY" "$FRAMEWORK"
          codesign --force --options runtime --timestamp --keychain "$KEYCHAIN_PATH" --sign "$APPLE_SIGNING_IDENTITY" "$APP_PATH"

          # Fail fast on a native, immediately-readable signature error
          # rather than waiting on an Apple notarization round-trip for
          # something codesign itself can already tell is broken.
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          ZIP_PATH="$RUNNER_TEMP/ReelForge-Connector-notarize.zip"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"

          RESULT_JSON="$RUNNER_TEMP/notarize-result.json"
          xcrun notarytool submit "$ZIP_PATH" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait --output-format json | tee "$RESULT_JSON"
          STATUS=$(python3 -c "import json; print(json.load(open('$RESULT_JSON'))['status'])")
          if [ "$STATUS" != "Accepted" ]; then
            SUB_ID=$(python3 -c "import json; print(json.load(open('$RESULT_JSON'))['id'])")
            echo "Notarization did not succeed (status: $STATUS) — full log:"
            xcrun notarytool log "$SUB_ID" \
              --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID"
            exit 1
          fi

          xcrun stapler staple "$APP_PATH"
          spctl --assess --type execute --verbose "$APP_PATH"

          # Tauri's own DMG and updater .tar.gz (built during "Build
          # ReelForge Connector" above) reflect the app BEFORE this fix and
          # BEFORE stapling — rebuilt here from the final, notarized app so
          # nothing pre-fix ever reaches a customer.
          rm -f "$BUNDLE_DIR/dmg/"*.dmg
          DMG_STAGING="$RUNNER_TEMP/dmg-staging"
          rm -rf "$DMG_STAGING" && mkdir -p "$DMG_STAGING"
          cp -R "$APP_PATH" "$DMG_STAGING/"
          ln -s /Applications "$DMG_STAGING/Applications"
          hdiutil create -volname "ReelForge Connector" -srcfolder "$DMG_STAGING" -ov -format UDZO "$BUNDLE_DIR/dmg/ReelForge Connector.dmg"

          rm -f "$BUNDLE_DIR/macos/ReelForge Connector.app.tar.gz" "$BUNDLE_DIR/macos/ReelForge Connector.app.tar.gz.sig"
          tar -czf "$BUNDLE_DIR/macos/ReelForge Connector.app.tar.gz" -C "$BUNDLE_DIR/macos" "ReelForge Connector.app"
          npx tauri signer sign "$BUNDLE_DIR/macos/ReelForge Connector.app.tar.gz"

      # The real Tauri-produced filenames carry the version number (e.g.
      # "ReelForge Connector_0.1.42_x64-setup.exe") — renaming to a fixed
      # name here is what lets the release asset (and, downstream, the
      # Supabase-hosted copy the web app links to) stay at one unchanging
      # filename across version bumps. `shell: bash` works on the Windows
      # runner too (GitHub-hosted Windows runners ship Git Bash), so one
      # script covers both platforms instead of duplicating it per-shell.
      #
      # Also writes a small JSON fragment (or, for macOS, two — see below)
      # with this platform's updater signature, version and download URL —
      # publish-release merges every fragment into the one latest.json the
      # updater polls.
      - name: Package installer + updater artifact
        shell: bash
        run: |
          set -e
          mkdir -p dist-release
          if [ "${{ matrix.target }}" = "darwin" ]; then
            BUNDLE_DIR="src-tauri/target/universal-apple-darwin/release/bundle"
            cp "$BUNDLE_DIR/dmg/"*.dmg "dist-release/ReelForge-Connector-macOS.dmg"
            cp "$BUNDLE_DIR/macos/ReelForge Connector.app.tar.gz" "dist-release/ReelForge-Connector-macOS.app.tar.gz"
            cp "$BUNDLE_DIR/macos/ReelForge Connector.app.tar.gz.sig" "dist-release/ReelForge-Connector-macOS.app.tar.gz.sig"
            SIG_FILE="dist-release/ReelForge-Connector-macOS.app.tar.gz.sig"
            ASSET_URL="https://github.com/${{ github.repository }}/releases/download/connector-latest/ReelForge-Connector-macOS.app.tar.gz"
            VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
            SIG=$(cat "$SIG_FILE")
            # One universal binary serves both Apple Silicon and Intel Macs,
            # so it needs to satisfy both platform keys the updater plugin
            # looks up depending on which architecture is asking.
            for PLATFORM in darwin-aarch64 darwin-x86_64; do
              printf '{"platform":"%s","version":"%s","signature":"%s","url":"%s"}\n' \
                "$PLATFORM" "$VERSION" "$SIG" "$ASSET_URL" \
                > "dist-release/$PLATFORM.fragment.json"
            done
          else
            cp "src-tauri/target/release/bundle/nsis/"*.exe "dist-release/ReelForge-Connector-Windows-Setup.exe"
            cp "src-tauri/target/release/bundle/nsis/"*.exe.sig "dist-release/ReelForge-Connector-Windows-Setup.exe.sig"
            SIG_FILE="dist-release/ReelForge-Connector-Windows-Setup.exe.sig"
            ASSET_URL="https://github.com/${{ github.repository }}/releases/download/connector-latest/ReelForge-Connector-Windows-Setup.exe"
            VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
            SIG=$(cat "$SIG_FILE")
            printf '{"platform":"%s","version":"%s","signature":"%s","url":"%s"}\n' \
              "${{ matrix.updater_platform }}" "$VERSION" "$SIG" "$ASSET_URL" \
              > "dist-release/${{ matrix.target }}.fragment.json"
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-release
          path: connector-app/dist-release/*

  publish-release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download all built installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      # Merges the two platforms' updater-signature fragments (written in
      # the build job above) into the single latest.json the updater in
      # every already-installed Connector polls on startup. Both fragments
      # share the same version (see "Set release version"), so this just
      # picks it up from either one.
      - name: Build latest.json update manifest
        working-directory: release-assets
        run: |
          node -e "
            const fs = require('fs');
            const frags = fs.readdirSync('.')
              .filter((f) => f.endsWith('.fragment.json'))
              .map((f) => JSON.parse(fs.readFileSync(f, 'utf8')));
            if (frags.length === 0) throw new Error('no updater fragments found');
            const platforms = {};
            for (const f of frags) platforms[f.platform] = { signature: f.signature, url: f.url };
            const manifest = {
              version: frags[0].version,
              notes: 'ReelForge Connector update.',
              pub_date: new Date().toISOString(),
              platforms,
            };
            fs.writeFileSync('latest.json', JSON.stringify(manifest, null, 2));
          "
          rm -f *.fragment.json

      - name: Publish rolling connector-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: connector-latest
          name: ReelForge Connector (latest)
          body: Always the most recent build from main. Not versioned — download the installer for your OS below. Already-installed Connectors update themselves automatically.
          make_latest: true
          files: release-assets/*
